<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#000000;
    --surface:#111219;
    --surface-2:#1A1C26;
    --ink:#F3F3F6;
    --muted:#8B90A3;
    --line:rgba(255,255,255,.12);
    --white:#FFFFFF;
    --ink-on-white:#20232B;
    --purple:#6D27D8;
    --purple-2:#8B4FF0;
    --cyan:#6DD6FF;
    --navy-btn:#16232C;
    --green:#34D399;
    --red:#FF5C72;
    --gold:#E8B23D;
    --gradient: linear-gradient(90deg, var(--purple), var(--cyan));
    --radius:16px;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); height:100%;}
  body{ font-family:'Inter',system-ui,sans-serif; overscroll-behavior-y: none; }
  #root{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative; }
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
  .display{font-family:'Fraunces',serif;}

  .topbar{
    padding: max(18px, env(safe-area-inset-top)) 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); background:var(--bg);
    position:sticky; top:0; z-index:5;
  }
  .topbar .logo{ height:26px; width:auto; display:block; }
  .topbar .month{font-size:12px; color:var(--cyan); font-weight:600; text-transform:uppercase; letter-spacing:.06em;}

  .screen{ flex:1; padding: 18px 18px 100px; overflow-y:auto; }

  .tabbar{
    position:sticky; bottom:0; z-index:6; display:flex; background:#000000;
    padding: 8px 4px max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; color:var(--muted);
    font-family:'Inter'; font-size:10px; font-weight:600; letter-spacing:.01em;
    padding:7px 1px; border-radius:12px; cursor:pointer;
  }
  .tab svg{width:19px; height:19px;}
  .tab.active{color:var(--white); background:linear-gradient(135deg, rgba(109,39,216,.35), rgba(109,214,255,.20));}

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .card h3{margin:0 0 10px; font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--white);}
  .muted{color:var(--muted); font-size:12.5px;}

  .typetoggle{display:flex; background:var(--surface-2); border-radius:14px; padding:4px; margin-bottom:16px;}
  .typetoggle button{ flex:1; border:none; background:none; padding:10px 0; border-radius:11px; font-family:'Inter'; font-weight:700; font-size:14px; color:var(--muted); cursor:pointer; }
  .typetoggle button.on.ingreso{background:var(--green); color:#062017;}
  .typetoggle button.on.gasto{background:var(--red); color:#2B0208;}

  .amount-wrap{ text-align:center; padding: 6px 0 14px; }
  .amount-wrap .cursym{font-size:22px; color:var(--cyan); font-family:'IBM Plex Mono'; margin-right:2px;}
  .amount-input{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:46px; text-align:center; border:none; background:none; width:60%; color:var(--white); outline:none; }

  .grouplabel{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin: 14px 2px 8px;}
  .catgrid{display:grid; grid-template-columns: repeat(2, 1fr); gap:8px;}
  .catbtn{ border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:11px 10px; font-family:'Inter'; font-size:13px; font-weight:600; color:var(--ink); text-align:left; cursor:pointer; line-height:1.25; }
  .catbtn.on{border-color:transparent; background:var(--gradient); color:#0A0812;}

  .rowline{display:flex; align-items:center; justify-content:space-between; padding:12px 2px; border-bottom:1px solid var(--line); color:var(--ink);}
  .rowline:last-child{border-bottom:none;}
  select, input[type=text], input[type=number]{
    font-family:'Inter'; font-size:14px; border:1px solid var(--line); border-radius:10px;
    padding:9px 10px; background:var(--white); color:var(--ink-on-white);
  }

  .savebtn{ width:100%; padding:16px; border:none; border-radius:14px; font-family:'Inter'; font-weight:700; font-size:16px; color:var(--white); background:var(--navy-btn); cursor:pointer; margin-top:6px; }
  .savebtn.ingreso{background:var(--green); color:#062017;}
  .savebtn.gasto{background:var(--red); color:#2B0208;}
  .savebtn:disabled{opacity:.35;}

  .kpi-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .kpi{flex:1; min-width:100px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:var(--shadow);}
  .kpi .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700;}
  .kpi .val{font-family:'IBM Plex Mono'; font-weight:700; font-size:16px; margin-top:4px; color:var(--white);}

  .cascade{display:flex; flex-direction:column; gap:6px; margin-top:6px;}
  .cascade-row{display:flex; align-items:center; gap:10px;}
  .cascade-lbl{width:70px; font-size:11.5px; font-weight:600; color:var(--muted); flex-shrink:0;}
  .cascade-bar-bg{flex:1; height:20px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
  .cascade-bar{height:100%; border-radius:6px;}
  .cascade-val{width:80px; text-align:right; font-family:'IBM Plex Mono'; font-size:11.5px; font-weight:600; flex-shrink:0; color:var(--ink);}

  .entry-row{display:flex; align-items:center; justify-content:space-between; padding:10px 2px; border-bottom:1px solid var(--line);}
  .entry-row:last-child{border-bottom:none;}
  .entry-left{display:flex; flex-direction:column;}
  .entry-cat{font-size:13.5px; font-weight:600; color:var(--ink);}
  .entry-meta{font-size:11px; color:var(--muted); margin-top:1px;}
  .entry-amt{font-family:'IBM Plex Mono'; font-weight:700; font-size:14px;}
  .entry-amt.ingreso{color:var(--green);}
  .entry-amt.gasto{color:var(--red);}
  .del-x{background:none; border:none; color:var(--muted); font-size:15px; padding:4px 6px; cursor:pointer;}

  .curtotals{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .curtotal{flex:1; min-width:100px; border-radius:14px; padding:12px; color:#0A0812; box-shadow:var(--shadow);}
  .curtotal .lbl{font-size:10px; text-transform:uppercase; opacity:.75; font-weight:700; letter-spacing:.05em;}
  .curtotal .val{font-family:'IBM Plex Mono'; font-weight:700; font-size:15.5px; margin-top:4px;}
  .curtotal.sol{background:var(--purple); color:var(--white);}
  .curtotal.usd{background:var(--cyan);}
  .curtotal.eur{background:var(--gold);}

  .acc-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:9px; box-shadow:var(--shadow);}
  .acc-top{display:flex; align-items:center; gap:8px;}
  .acc-name-input{flex:1; border:none; background:none; font-weight:700; font-size:14.5px; padding:2px 0; border-bottom:1px dashed transparent; color:var(--white);}
  .acc-name-input:focus{border-bottom-color:var(--line);}
  .pill{font-size:10px; font-weight:700; padding:3px 8px; border-radius:10px; color:var(--white); flex-shrink:0;}
  .pill.sol{background:var(--purple);} .pill.usd{background:var(--cyan); color:#0A0812;} .pill.eur{background:var(--gold); color:#0A0812;}
  .acc-nums{display:flex; justify-content:space-between; align-items:center; margin-top:9px;}
  .acc-nums .startedit{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);}
  .acc-nums .startedit input{width:74px; padding:5px 7px; font-size:12.5px;}
  .acc-nums .balance{font-family:'IBM Plex Mono'; font-weight:700; font-size:15px; color:var(--white);}

  .addform{display:flex; gap:6px; margin-top:4px; flex-wrap:wrap;}
  .addform input[type=text]{flex:1; min-width:120px;}
  .addform select{width:auto;}
  .addform button{border:none; background:var(--gradient); color:#0A0812; border-radius:10px; padding:0 14px; font-weight:700; font-size:13px; cursor:pointer;}

  .edit-item{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line);}
  .edit-item:last-child{border-bottom:none;}
  .edit-item input[type=text]{flex:1;}
  .grouptoggle{border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:5px 9px; font-size:10.5px; font-weight:700; color:var(--muted); cursor:pointer; flex-shrink:0;}

  .goal-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .goal-name{font-weight:700; font-size:14.5px; color:var(--white);}
  .goal-prio{font-size:10.5px; background:var(--gradient); color:#0A0812; padding:2px 8px; border-radius:10px; font-weight:700;}
  .goal-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
  .progress-bg{height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden; margin:8px 0 8px;}
  .progress-fill{height:100%; background:var(--gradient); border-radius:6px;}
  .goal-nums{display:flex; justify-content:space-between; font-family:'IBM Plex Mono'; font-size:12px; color:var(--muted);}
  .goal-actions{display:flex; gap:8px; margin-top:10px;}
  .goal-actions input{flex:1; min-width:0;}
  .goal-actions button{border:none; background:var(--gradient); color:#0A0812; border-radius:10px; padding:0 14px; font-weight:700; font-size:13px; cursor:pointer;}
  .target-edit{border:none; background:none; font-family:'IBM Plex Mono'; text-align:right; width:80px; color:var(--muted); border-bottom:1px dashed var(--line);}

  .splash{ position:fixed; inset:0; background:#000000; color:var(--white); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px; }
  .splash .check{font-size:52px; margin-bottom:14px; width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--gradient);}
  .splash h2{font-family:'Fraunces',serif; font-size:26px; margin:0 0 6px;}
  .splash p{opacity:.7; font-size:14px; margin:0 0 26px; color:var(--muted);}
  .splash button{ background:var(--surface-2); border:1px solid var(--line); color:var(--white); padding:12px 22px; border-radius:12px; font-weight:700; font-size:14px; cursor:pointer; }

  .toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--surface-2); color:var(--white); border:1px solid var(--line); padding:10px 18px; border-radius:30px; font-size:13px; font-weight:600; z-index:40; box-shadow:var(--shadow); opacity:0; transition:opacity .25s ease; pointer-events:none; text-align:center; max-width:88%;}
  .toast.show{opacity:1;}

  .empty{text-align:center; padding:24px 10px; color:var(--muted); font-size:13px;}

  .fx-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);}
  .fx-row:last-child{border-bottom:none;}
  .fx-updated{font-size:11px; color:var(--muted); margin-top:2px;}
  .fx-refresh{border:1px solid var(--line); background:var(--surface-2); color:var(--cyan); border-radius:10px; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .switch{position:relative; width:38px; height:22px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .track{position:absolute; inset:0; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; transition:.2s; cursor:pointer;}
  .switch .track:before{content:""; position:absolute; width:16px; height:16px; left:2px; top:2px; background:var(--muted); border-radius:50%; transition:.2s;}
  .switch input:checked + .track{background:var(--gradient); border-color:transparent;}
  .switch input:checked + .track:before{transform:translateX(16px); background:#fff;}
</style>

  /* ---------------- live exchange rates ---------------- */
  async function fetchLiveRates(force){
    var s = state.settings;
    if(!force && s.fxAuto===false) return false;
    var dayMs = 24*60*60*1000;
    if(!force && s.fxUpdatedAt && (Date.now()-s.fxUpdatedAt) < dayMs) return false;
    try{
      var res = await fetch('https://open.er-api.com/v6/latest/USD');
      var data = await res.json();
      if(data && data.result==='success' && data.rates && data.rates.PEN && data.rates.EUR){
        s.tc_usd = Math.round(data.rates.PEN*10000)/10000;
        s.tc_eur = Math.round((data.rates.PEN/data.rates.EUR)*10000)/10000;
        s.fxUpdatedAt = Date.now();
        s.fxError = null;
        persist();
        return true;
      }
      s.fxError = 'Respuesta inesperada del servicio de tipo de cambio.';
    }catch(e){
      s.fxError = 'No se pudo actualizar (revisa tu conexión). Se sigue usando el último tipo de cambio guardado.';
    }
    return false;
  }

       {label:'Variables', items: state.expenseCategories.filter(function(c){return c.group!=='Fijos';})}];

      });

    var btn = el('button',{class:'savebtn '+ui.addType, id:'saveBtn'},[ui.addType==='ingreso' ? 'Guardar ingreso' : 'Guardar gasto']);
    if(!canSave) btn.setAttribute('disabled','disabled');
    btn.addEventListener('click', function(){
      var amt = parseFloat(input.value);
      if(!(amt>0) || !ui.addCategory) return;
      var group = null;

        var catObj = state.expenseCategories.find(function(c){return c.name===ui.addCategory;});

      setTimeout(function(){
        var a=document.getElementById('amountInput'); if(a) a.value=v;

      },0);

  }

  function buildResumenText(mk, t, entries){
    var lines = [];
    lines.push('RESUMEN — ' + monthLabel(mk));
    lines.push('');
    lines.push('Ingreso total: ' + fmt(t.ingreso));
    lines.push('Gastos fijos: ' + fmt(t.fijos));
    lines.push('Gastos variables: ' + fmt(t.variables));
    lines.push('Restante: ' + fmt(t.restante));
    lines.push('');
    lines.push('— Por categoría —');
    var byCat = {};
    entries.forEach(function(e){
      if(e.type!=='gasto') return;
      byCat[e.category] = (byCat[e.category]||0) + e.soles;
    });
    Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];}).forEach(function(c){
      lines.push(c + ': ' + fmt(byCat[c]));
    });
    lines.push('');
    lines.push('— Movimientos (' + entries.length + ') —');
    entries.forEach(function(e){
      lines.push(e.date + '  ' + (e.type==='ingreso'?'+':'-') + fmtCur(e.amount,e.currency) + '  ' + e.category + '  [' + e.accountName + ']');
    });
    return lines.join('\n');
  }

  function fxStatusText(){
    var s = state.settings;
    if(s.fxError) return s.fxError;
    if(!s.fxUpdatedAt) return 'Todavía no se ha actualizado.';
    var d = new Date(s.fxUpdatedAt);
    return 'Última actualización: ' + d.toLocaleDateString('es-PE') + ' ' + d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  }

  function render(){
    var root = document.getElementById('root');
    root.innerHTML = '';

    root.appendChild(renderTopbar());
    var screenMap = {agregar:screenAgregar, resumen:screenResumen, cuentas:screenCuentas, metas:screenMetas, ajustes:screenAjustes};
    root.appendChild(screenMap[ui.tab]());

    var tabs = [
      {id:'agregar', label:'Anotar', icon:ICONS.add},
      {id:'resumen', label:'Resumen', icon:ICONS.chart},
      {id:'cuentas', label:'Cuentas', icon:ICONS.wallet},
      {id:'metas', label:'Metas', icon:ICONS.target},
      {id:'ajustes', label:'Ajustes', icon:ICONS.gear}
    ];
    var bar = el('div',{class:'tabbar'});
    tabs.forEach(function(t){
      bar.appendChild(el('button',{class:'tab'+(ui.tab===t.id?' active':''), html:t.icon+'<span>'+t.label+'</span>', onclick:function(){ ui.tab=t.id; render(); }}));
    });
    root.appendChild(bar);
  }

    div.appendChild(el('div',{class:'check', html:'<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>'}));
    div.appendChild(el('h2',{},[fmtCur(s.amount, s.currency)]));
    div.appendChild(el('p',{},[(s.type==='ingreso'?'Ingreso guardado · ':'Gasto guardado · ')+s.category+' · '+s.accountName]));
    div.appendChild(el('button',{onclick:function(){ ui.splash=null; ui.tab='resumen'; render(); }},['Ver resumen']));
    return div;
  }

  /* ---------------- quick-add via URL (for iPhone Shortcut) ---------------- */
  function handleUrlQuickAdd(){
    var params = new URLSearchParams(window.location.search);
    var monto = parseFloat(params.get('monto'));
    if(!(monto>0)) return false;
    var tipo = (params.get('tipo')==='ingreso') ? 'ingreso' : 'gasto';
    var cuentaName = params.get('cuenta');
    var account = (cuentaName && accountByName(cuentaName)) || state.accounts[0];
    if(!account) return false;
    var categoria = params.get('categoria');
    var group = null;
    if(tipo==='gasto'){
      var catObj = categoria && state.expenseCategories.find(function(c){return c.name===categoria;});
      group = catObj ? catObj.group : 'Variables';
      if(!categoria) categoria = 'Misceláneos';
    } else if(!categoria) categoria = 'Otro ingreso';
    addEntry(tipo, categoria, group, monto, account, '');
    ui.splash = { type:tipo, category:categoria, amount:monto, currency:account.currency, accountName:account.name };
    history.replaceState({}, '', window.location.pathname);
    return true;
  }

  (async function init(){
    await loadState();
    var quickAdded = handleUrlQuickAdd();
    render();
    var updated = await fetchLiveRates(false);
    if(updated && !quickAdded) render();
  })();

})();
</script>
